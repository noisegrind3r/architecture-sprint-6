type Client {
  id: ID!
  name: String!
  age: Int!
  documents: [Document!]
  relatives: [Relative!]
}

type Document {
  id: ID!
  type: String!
  number: String!
  issueDate: String!
  expiryDate: String!
}

type Relative {
  id: ID!
  relationType: String!
  name: String!
  age: Int!
}

# Получить клиента и полную информацию по нему по его ID, другие эндпоинты больше не потребуются 
type Query {
  client(id: ID!): Client
}