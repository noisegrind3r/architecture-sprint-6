http {
    # Определяем зону для ограничения запросов
    limit_req_zone $binary_remote_addr zone=limit_zone:10m rate=10r/m;

    # Настройка upstream для балансировки нагрузки
    upstream backend_servers {
        server backend1.example.com;
        server backend2.example.com;
        server backend3.example.com;
    }

    server {
        listen 80;

        # Применяем ограничение запросов для всех запросов к серверу
        location / {
            # Используем зону limit_zone с ограничением 10 запросов в минуту
            limit_req zone=limit_zone burst=5 nodelay;
            proxy_pass http://backend_servers;

            # Обработка ошибки 429
            error_page 429 = @too_many_requests;
        }

        # Кастомный обработчик для ошибки 429
        location @too_many_requests {
            return 429 'Too Many Requests\n';
        }
    }
}


http {
  limit_req_zone $binary_remote_addr zone=rate_limiter:10m rate=10r/m;
     
  # Настройка upstream для балансировки нагрузки
  upstream backend_servers {
    server backend1.example.com;
    server backend2.example.com;
    server backend3.example.com;
  }

  server {
    listen 80;

    location / {
      proxy_pass http://backend_servers;

      limit_req zone=rate_limiter;
      limit_req_status 429;
    }
  }
}
 